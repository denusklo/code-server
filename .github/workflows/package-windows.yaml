name: Package windows

# Builds a windows release tarball the same way package-macos builds a darwin
# one: on that platform's own runner, with the native modules compiled there.
# Kept separate from release.yaml so it can be triggered on its own.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag to build, for example v4.132.0
        required: true
        type: string

jobs:
  package-windows:
    name: win32-x64
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VSCODE_TARGET: win32-x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.version }}
      # Ensure native modules are built from source to avoid prebuilds.
      npm_config_build_from_source: true
      # The runner has both a 2022 and an older toolset; say which one.
      npm_config_msvs_version: 2022
      # The build works out which system it is on and puts the answer in OS,
      # but only when OS is empty, and windows always fills it in with
      # something else. Every question the build asks about the system
      # therefore gets the wrong answer, from which launchers to fix up to
      # what the archive is called. Answering it up front is what the check
      # for an existing value is there to allow.
      OS: windows

    steps:
      # Git on windows rewrites line endings on checkout by default, which
      # turns every shell script in the build into one bash cannot read and
      # every name in patches/series into one with a stray return on the end.
      - name: Keep line endings as they are in the repository
        shell: bash
        run: git config --global core.autocrlf false

      # Takes the tag with or without its v, since both spellings get typed.
      - name: Resolve the tag
        shell: bash
        run: |
          tag=${TAG#update/}
          tag=${tag#v}
          echo "TAG_REF=v$tag" >> $GITHUB_ENV
          echo "VERSION=$tag" >> $GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.TAG_REF }}
          submodules: true

      # quilt has no windows build. The patches are ordinary -p1 diffs against
      # the repository root, so git applies them in the order series names.
      - name: Apply patches
        shell: bash
        run: |
          while read -r patch; do
            case "$patch" in '' | '#'*) continue ;; esac
            echo "applying $patch"
            git apply --whitespace=nowarn "patches/$patch"
          done < patches/series

      # Four corrections to code-server's own build scripts, every one of them
      # in a windows arm that has never run. They are applied here rather than
      # worked around, because the bugs are in those scripts and each hunk
      # below is a coder PR waiting to be written. They go here because the
      # checkout above replaces the tree with the tag's own copy of them.
      - name: Correct the windows arms of the build scripts
        shell: bash
        run: |
          # Replace one exact occurrence, and stop if the tag no longer says what this
          # was written against. A tag that already carries a fix should be noticed
          # rather than patched a second time.
          correct() {
            local file=$1 old=$2 new=$3 count
            # Counted with perl rather than grep because some of these span
            # more than one line, and grep -F reads a multi-line pattern as
            # several alternatives and counts lines matching any of them.
            count=$(old=$old perl -0777 -ne '$c = 0; $c++ while /\Q$ENV{old}\E/g; print $c' "$file")
            if [ "$count" != 1 ]; then
              echo "expected exactly one match in $file, found $count:"
              echo "$old"
              exit 1
            fi
            old=$old new=$new perl -0777 -pi -e 's/\Q$ENV{old}\E/$ENV{new}/' "$file"
            echo "corrected $file"
          }

          # 1. The remote-cli launcher is named after product.applicationName, which
          # this repository overrides to code-server, so the file gulp writes is
          # remote-cli/code-server.cmd. The windows arm of build-vscode.sh asks for
          # remote-cli/code.cmd, which is the name of the *template* it is built from.
          # Its own posix arm, four lines below, already spells it remote-cli/code-server
          # -- only the windows arm has never run. See lib/vscode build/gulpfile.reh.ts,
          # the platform === 'win32' arm:
          #   rename(`bin/remote-cli/${product.applicationName}.cmd`)
          correct ci/build/build-vscode.sh \
            '      fix-bin-script remote-cli/code.cmd' \
            '      fix-bin-script remote-cli/code-server.cmd'

          # 2. fix-bin-script rewrites the launcher's ROOT to the release root so it can
          # find code-server's own tree, and then has to send the two things that still
          # live in the vscode tree back down again. It does that for out/ on both
          # platforms, and for the node binary only on posix, where the third sed
          # rewrites $ROOT/node to $ROOT/lib/node. The windows half has no counterpart,
          # so the .cmd launchers look for node.exe at the release root while
          # build-release.sh puts it in lib.
          #
          # Read-derived from the templates and the release layout, NOT confirmed by
          # running the artifact: if the runtime proof finds node somewhere else, this is
          # the line to distrust first. NODE_EXEC_PATH, which the posix rewrite also
          # honours, has no equivalent here.
          old_sed=$(cat <<'EOF'
            sed -i.bak 's/%ROOT_DIR%\\out/%VSROOT_DIR%\\out/g' "$script"
          EOF
          )
          new_sed=$(cat <<'EOF'
            sed -i.bak 's/%ROOT_DIR%\\out/%VSROOT_DIR%\\out/g' "$script"
            sed -i.bak 's/%ROOT_DIR%\\node.exe/%ROOT_DIR%\\lib\\node.exe/g' "$script"
          EOF
          )
          correct ci/build/build-vscode.sh "$old_sed" "$new_sed"

          # 3. The node binary is called node.exe on windows -- gulpfile.reh.ts renames
          # it in the same win32 arm as above -- so this copy asks for a file that is not
          # there, and takes the whole release step down with it under set -e.
          old_cp=$(cat <<'EOF'
              cp "./lib/vscode-reh-web-$VSCODE_TARGET/node" "$RELEASE_PATH/lib"
          EOF
          )
          new_cp=$(cat <<'EOF'
              if [ "$OS" = windows ]; then
                cp "./lib/vscode-reh-web-$VSCODE_TARGET/node.exe" "$RELEASE_PATH/lib"
              else
                cp "./lib/vscode-reh-web-$VSCODE_TARGET/node" "$RELEASE_PATH/lib"
              fi
          EOF
          )
          correct ci/build/build-release.sh "$old_cp" "$new_cp"

          # 4. The same name again, in the exclusion that keeps node out of lib/vscode
          # because it belongs one directory above it. /node does not match node.exe, so
          # on windows the binary is copied into lib/vscode as well as being placed above
          # it. Adding the windows spelling costs nothing where no such file exists.
          old_ex=$(cat <<'EOF'
            rsync_opts+=(--exclude /node)
          EOF
          )
          new_ex=$(cat <<'EOF'
            rsync_opts+=(--exclude /node)
            rsync_opts+=(--exclude /node.exe)
          EOF
          )
          correct ci/build/build-release.sh "$old_ex" "$new_ex"

          # 5. build-packages.sh renames the tree's top directory as it
          # archives, and reaches for bsdtar's -s off linux because that is
          # what macos has. The bsdtar windows ships is built without
          # substitution support -- it answers "-s is not supported by this
          # version of bsdtar", and its --help lists no such option -- so
          # windows belongs on the GNU --transform arm instead. Verified
          # locally against both: bsdtar 3.7.7 from System32 refuses -s, and
          # git bash's own GNU tar 1.34 takes the linux line verbatim and
          # produces the correctly renamed top directory owned by 0/0.
          old_tar=$(cat <<'EOF'
            if [[ $OS == "linux" ]]; then
              tar -czf "release-packages/$release_name.tar.gz" --owner=0 --group=0 --transform "s/^$RELEASE_PATH/$release_name/" "$RELEASE_PATH"
          EOF
          )
          new_tar=$(cat <<'EOF'
            if [[ $OS == "linux" || $OS == "windows" ]]; then
              tar -czf "release-packages/$release_name.tar.gz" --owner=0 --group=0 --transform "s/^$RELEASE_PATH/$release_name/" "$RELEASE_PATH"
          EOF
          )
          correct ci/build/build-packages.sh "$old_tar" "$new_tar"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/package-lock.json

      # npm hands every script it runs to cmd, which cannot run the shell
      # scripts this repository is built out of. Point it at the same bash the
      # steps here use rather than at a path, which moves between images.
      - name: Let npm run shell scripts
        shell: bash
        run: echo "npm_config_script_shell=$(cygpath -w "$(command -v bash)")" >> $GITHUB_ENV

      # The build merges json by handing jq a process substitution, which bash
      # presents as a file under /dev/fd. The jq on this image is a windows
      # program and cannot open those, so it reads the second input as nothing
      # and the merge fails. This hands it a real file instead. Both the
      # product and the package merge go through here.
      - name: Let jq read what bash hands it
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          cat > "$RUNNER_TEMP/shim/jq" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            case $arg in
              /dev/fd/* | /proc/*/fd/*)
                copy=$(mktemp)
                cat "$arg" > "$copy"
                args+=("$copy")
                ;;
              *) args+=("$arg") ;;
            esac
          done
          exec jq.exe "${args[@]}"
          SHIM
          chmod +x "$RUNNER_TEMP/shim/jq"
          echo "$RUNNER_TEMP/shim" >> $GITHUB_PATH

      # Stamping version details into the native binaries clears any signature
      # they arrived with first, and asks signtool whether there is one. That
      # only reads and removes, so it wants no certificate and signs nothing —
      # it just has to be findable, and the sdk that carries it is not on the
      # path.
      - name: Put signtool on the path
        shell: bash
        run: |
          sdk=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin"/*/x64 | sort -V | tail -1)
          echo "using $sdk"
          test -x "$sdk/signtool.exe"
          cygpath -w "$sdk" >> $GITHUB_PATH

      # Every native module here is built rather than downloaded, and building
      # them needs headers for the node they are built against. Those are the
      # same for a given node version, so they are kept between runs. This
      # holds nothing that was compiled, so a hit can only save downloading,
      # never hand the build a stale binary.
      #
      # Restore and save are separate because the whole action saves only on a
      # green job: its post step is declared post-if success(). While this job
      # is being brought up on windows it has failed every time, so the cache
      # it is meant to fill could never come into existence, and the step that
      # was added to shorten the loop did nothing for exactly the runs it was
      # added for. Saving after npm ci instead fills it on the first run that
      # gets that far.
      - name: Restore the node headers from a previous run
        id: node-headers
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/node-gyp/Cache
          key: node-gyp-${{ runner.os }}-${{ hashFiles('.node-version') }}

      - id: npm-ci
        run: npm ci
        shell: bash

      # npm ci is what downloads the headers, so this is the earliest point
      # they exist and the latest point that is still before anything that can
      # fail for reasons of its own. It runs even when a later step has already
      # failed, but not when npm ci itself did, since a half-written header
      # tree under an exact key would be a cache no later run could correct.
      #
      # The key is exact and there are no restore-keys. It names a node version
      # and nothing else, so anything that would change it changes which
      # headers are wanted, and a near miss would be the wrong ones rather than
      # a head start.
      - name: Save the node headers for the next run
        if: always() && steps.npm-ci.outcome == 'success' && steps.node-headers.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/node-gyp/Cache
          key: ${{ steps.node-headers.outputs.cache-primary-key }}

      - run: npm run build
        shell: bash
      - run: npm run build:vscode
        shell: bash
      # build-release.sh copies the tree with rsync, which neither windows nor
      # the git bash on the runner has. MSYS2 is already here, just not on the
      # path, and it is only put in front for the step that needs it.
      - name: Install rsync
        shell: cmd
        run: C:\msys64\usr\bin\pacman -Sy --noconfirm --needed rsync

      - name: Build the release tree
        shell: bash
        run: |
          PATH="/c/msys64/usr/bin:$PATH"
          rsync --version | head -1
          KEEP_MODULES=1 npm run release

      # No PATH change here on purpose. The archive step needs a tar that can
      # rename the tree's top directory, and of the two on this image it is
      # git bash's own GNU tar that can: windows' bsdtar is built without
      # substitution support and refuses -s outright. The correction above
      # puts windows on the --transform arm to match, so the tar already in
      # front is the right one. Asserted rather than assumed, since the two
      # are interchangeable everywhere except in exactly this.
      - name: Package
        shell: bash
        run: |
          tar --version | head -1
          case "$(tar --version | head -1)" in
            *GNU*) ;;
            *) echo "expected GNU tar for --transform, got the above" >&2; exit 1 ;;
          esac
          npm run package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-server-${{ inputs.version }}-windows-x64
          path: release-packages/*.tar.gz
          if-no-files-found: error
